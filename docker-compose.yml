# Local development only: Postgres, the API and Vite's dev server, with the source mounted so
# changes reload. The real app runs on the apps server (spec §8).
#
#   docker compose up -d     then open http://localhost:5173/wolog/
#
# Everything listens on 127.0.0.1 only. The password is for this throwaway local database.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wolog
      POSTGRES_PASSWORD: wolog
      POSTGRES_DB: wolog
    ports:
      - "127.0.0.1:5462:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolog -d wolog"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: postgresql+psycopg://wolog:wolog@postgres:5432/wolog
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      # Vite's dev server sends /wolog/api/ here (vite.config.ts)
      API_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
