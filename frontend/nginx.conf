# Serves the built SPA inside the wolog-frontend container.
# The apps server's nginx forwards /wolog/<path> here as /<path>.

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Container health check (not the API's health, which is /wolog/health on the server)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # index.html must never be cached, so a new deploy is picked up straight away.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Vite's built files have a content hash in their names, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Everything else: the file if it exists, otherwise the SPA's router handles the path.
    location / {
        try_files $uri /index.html;
    }
}
