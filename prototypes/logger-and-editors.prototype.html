<title>Wolog Logger Prototype</title>
<!--
  PROTOTYPE - throwaway. Answers "Prototype the logger and editor screens" (wolog issue 11).
  Three variants of the logger, switchable with #a / #b / #c (or the bottom bar, or arrow keys):
    A Sheet    - paper-log grid, Lines as rows and Sets as cells; Routine switch in the header; bottom tabs.
    B Focus    - one Line at a time with big steppers; menu drawer; switch only on the Routines screen.
    C Timeline - today card on top of a history feed; Lines expand inline; switch is a header chip.
  History and the Routine editor are shared rough screens. State is in memory only; reload resets it.
-->
<style>

.stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; align-items: center; }

.stepper input { height: 56px; text-align: center; font-size: 30px; font-family: var(--mono); font-weight: 700; border: 1px solid var(--line); border-radius: 12px; width: 100%; min-width: 0; background: var(--surface); }
.stepper .lab { grid-column: 1 / -1; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useReducer, useEffect, useMemo, Fragment } = React;
const html = htm.bind(React.createElement);

/* ---------- utils ---------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => iso(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
const fmtDate = s => new Date(s + 'T12:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const relDays = s => { const n = Math.round((new Date(today() + 'T12:00') - new Date(s + 'T12:00')) / 864e5); return n === 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago'; };
let _id = 1000; const nid = p => p + (++_id);
const norm = t => (t || '').trim().replace(/\s+/g, ' ');
const key = t => t.toLowerCase();
const move = (arr, i, dir) => { const j = i + dir; if (i < 0 || j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
const R = (s, id) => s.routines.find(r => r.id === id);
const D = (s, id) => s.days.find(d => d.id === id);
const EX = (s, id) => s.exercises.find(e => e.id === id);
const setCount = x => x.lines.reduce((a, l) => a + l.sets.length, 0);

/* ---------- seed ---------- */
function seed() {
  const names = ['Bench Press', 'Incline DB Press', 'Overhead Press', 'Triceps Pushdown', 'Lateral Raise', 'Barbell Row', 'Pull-up', 'Lat Pulldown', 'Barbell Curl', 'Back Squat', 'Romanian Deadlift', 'Leg Press', 'Lying Leg Curl', 'Standing Calf Raise'];
  const exercises = names.map((name, i) => ({ id: 'e' + i, name, retired: false }));
  exercises.push({ id: 'e99', name: 'Smith Squat', retired: true });
  const E = n => exercises.find(e => e.name === n).id;
  const L = ns => ns.map(n => ({ id: nid('dl'), exId: E(n) }));
  const days = [
    { id: 'd1', routineId: 'r1', name: 'Push', lines: L(['Bench Press', 'Incline DB Press', 'Overhead Press', 'Triceps Pushdown', 'Lateral Raise']) },
    { id: 'd2', routineId: 'r1', name: 'Pull', lines: L(['Barbell Row', 'Pull-up', 'Lat Pulldown', 'Barbell Curl']) },
    { id: 'd3', routineId: 'r1', name: 'Legs', lines: L(['Back Squat', 'Romanian Deadlift', 'Leg Press', 'Lying Leg Curl', 'Standing Calf Raise']) },
    { id: 'd4', routineId: 'r1', name: 'Deload Full Body', lines: L(['Back Squat', 'Bench Press', 'Barbell Row']) },
    { id: 'd5', routineId: 'r2', name: 'Upper', lines: L(['Bench Press', 'Barbell Row', 'Overhead Press', 'Pull-up']) },
    { id: 'd6', routineId: 'r2', name: 'Lower', lines: L(['Back Squat', 'Romanian Deadlift', 'Standing Calf Raise']) },
  ];
  const routines = [
    { id: 'r1', name: 'PPL', turns: [{ id: 't1', dayId: 'd1' }, { id: 't2', dayId: 'd2' }, { id: 't3', dayId: 'd1' }, { id: 't4', dayId: 'd3' }] },
    { id: 'r2', name: 'Upper/Lower', turns: [{ id: 't5', dayId: 'd5' }, { id: 't6', dayId: 'd6' }] },
  ];
  const P = spec => spec.split(',').map(t => { const [a, note] = t.split(':'); const w = a.endsWith('w'); const [wt, r] = a.replace('w', '').split('x'); return { id: nid('s'), weight: +wt, reps: +r, warmup: w, note: note || '' }; });
  const S = (date, routineId, dayId, turnId, lines) => ({ id: nid('ss'), date, routineId, dayId, turnId, lines: lines.map(([n, spec]) => ({ id: nid('sl'), exId: E(n), sets: spec ? P(spec) : [] })) });
  const sessions = [
    S(daysAgo(31), 'r2', 'd5', 't5', [['Bench Press', '95x10w,145x8,145x8,145x7'], ['Barbell Row', '135x10,135x10'], ['Overhead Press', '85x8,85x8'], ['Pull-up', '0x8,0x7']]),
    S(daysAgo(10), 'r1', 'd1', 't1', [['Bench Press', '95x10w,150x8,150x8,150x6'], ['Incline DB Press', '50x10,50x9,50x8'], ['Overhead Press', '85x8,85x7'], ['Triceps Pushdown', '50x12,50x12'], ['Lateral Raise', '15x15,15x14']]),
    S(daysAgo(8), 'r1', 'd2', 't2', [['Barbell Row', '135x10,145x8,145x8'], ['Pull-up', '0x8,0x7,0x6'], ['Lat Pulldown', '120x10,120x10'], ['Barbell Curl', '60x10,60x9']]),
    S(daysAgo(5), 'r1', 'd3', 't4', [['Back Squat', '135x5w,205x5,205x5,205x5'], ['Romanian Deadlift', '155x8,155x8'], ['Leg Press', '270x10,270x10'], ['Lying Leg Curl', '90x10,90x10'], ['Standing Calf Raise', '180x12,180x12']]),
    S(daysAgo(3), 'r1', 'd1', 't1', [['Bench Press', '95x10w,135x5w,155x8,155x7:paused first rep,155x6'], ['Incline DB Press', '55x9,55x8,50x10'], ['Overhead Press', '85x8,90x6'], ['Triceps Pushdown', '55x12,55x10'], ['Lateral Raise', '15x15,17.5x12']]),
    S(daysAgo(2), 'r1', 'd2', 't2', [['Barbell Row', '145x8,145x8,145x8'], ['Pull-up', '0x8,0x8,0x6'], ['Lat Pulldown', '125x10,125x9'], ['Barbell Curl', '60x10,65x8']]),
  ];
  const skips = [{ id: 'k1', date: daysAgo(7), routineId: 'r1', turnId: 't3', dayId: 'd1' }];
  return { exercises, days, routines, sessions, skips, engagedId: 'r1', viewDate: today(), draft: null, flash: null, flashN: 0 };
}

/* ---------- decided rules ---------- */
// Cursor: latest Session then later Skips on this Routine; walk back past any whose Turn is gone.
function cursorIdx(s, r) {
  const items = [
    ...s.sessions.filter(x => x.routineId === r.id).map(x => ({ date: x.date, ord: -1, turnId: x.turnId })),
    ...s.skips.map((x, i) => ({ ...x, ord: i })).filter(x => x.routineId === r.id).map(x => ({ date: x.date, ord: x.ord, turnId: x.turnId })),
  ].sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.ord - a.ord);
  for (const it of items) { const i = r.turns.findIndex(t => t.id === it.turnId); if (i >= 0) return i; }
  return -1;
}
const suggestedTurn = (s, r) => r && r.turns.length ? r.turns[(cursorIdx(s, r) + 1) % r.turns.length] : null;
// Picking a Day pins that Day's first Turn going forward from the cursor.
function pinTurn(s, r, dayId) {
  const n = r.turns.length, c = cursorIdx(s, r);
  for (let k = 1; k <= n; k++) { const t = r.turns[((c + k) % n + n) % n]; if (t.dayId === dayId) return t; }
  return null;
}
const turnLabel = (r, turnId) => { const i = r.turns.findIndex(t => t.id === turnId); return i < 0 ? 'no Turn' : `Turn ${i + 1} of ${r.turns.length}`; };
// Last-time: same Exercise, latest Session strictly before this date that has a Set of it.
function lastTime(s, exId, before) {
  const prior = s.sessions.filter(x => x.date < before).sort((a, b) => a.date < b.date ? 1 : -1);
  for (const x of prior) { const groups = x.lines.filter(l => l.exId === exId && l.sets.length).map(l => l.sets); if (groups.length) return { date: x.date, groups }; }
  return null;
}
// Prefill: previous Set on this Line, else last-time's first Working Set (else its first Set), else empty.
function prefill(s, line, date) {
  if (line.sets.length) { const p = line.sets[line.sets.length - 1]; return { reps: p.reps, weight: p.weight }; }
  const lt = lastTime(s, line.exId, date); if (!lt) return { reps: '', weight: '' };
  const all = lt.groups.flat(); const w = all.find(x => !x.warmup) || all[0]; return { reps: w.reps, weight: w.weight };
}
function currentDraft(s) {
  if (s.draft && s.draft.date === s.viewDate) return s.draft;
  const sug = suggestedTurn(s, R(s, s.engagedId));
  if (!sug) return { date: s.viewDate, dayId: null, lines: [] };
  return { date: s.viewDate, dayId: sug.dayId, lines: D(s, sug.dayId).lines.map(l => ({ id: 'dr-' + l.id, exId: l.exId, sets: [] })) };
}
function useLog(s) {
  const date = s.viewDate, session = s.sessions.find(x => x.date === date);
  if (session) { const r = R(s, session.routineId); return { date, session, routine: r, day: D(s, session.dayId), lines: session.lines, started: true, turnText: turnLabel(r, session.turnId) }; }
  const r = R(s, s.engagedId), sug = suggestedTurn(s, r), d = currentDraft(s);
  const pin = d.dayId ? pinTurn(s, r, d.dayId) : null;
  return { date, session: null, routine: r, sug, day: d.dayId && D(s, d.dayId), lines: d.lines, started: false, overridden: !!(sug && d.dayId !== sug.dayId),
    pin, turnText: pin ? turnLabel(r, pin.id) : '', todaySkips: s.skips.filter(k => k.date === date && k.routineId === r.id), canSkip: date === today() && !!sug };
}
function resolveEx(s, name) {
  const n = norm(name); if (!n) { s.flash = 'An Exercise needs a name.'; return null; }
  const m = s.exercises.find(e => key(e.name) === key(n));
  if (m && m.retired) { s.flash = `${m.name} is Retired. Un-retire it in the library to use it.`; return null; }
  if (m) return m.id;
  const id = nid('e'); s.exercises.push({ id, name: n, retired: false }); s.flash = `Created Exercise "${n}".`; return id;
}
function badSet(f) {
  if (!(Number.isInteger(+f.reps) && +f.reps > 0)) return 'Reps must be a positive whole number.';
  if (f.weight === '' || !(+f.weight >= 0)) return 'Weight must be 0 or more.';
  return null;
}

/* ---------- reducer ---------- */
function reducer(state, a) {
  if (a.type === 'RESET') return seed();
  const s = structuredClone(state); s.flash = null;
  const r = R(s, s.engagedId);
  const sess = s.sessions.find(x => x.date === s.viewDate);
  const host = () => { if (sess) return sess; if (!(s.draft && s.draft.date === s.viewDate)) s.draft = structuredClone(currentDraft(s)); return s.draft; };
  switch (a.type) {
    case 'VIEW': s.viewDate = a.date; s.draft = null; break;
    case 'PICK_DAY': { const d = D(s, a.dayId); s.draft = { date: s.viewDate, dayId: d.id, lines: d.lines.map(l => ({ id: nid('dr'), exId: l.exId, sets: [] })) }; break; }
    case 'ADD_SET': {
      const err = badSet(a.set); if (err) { s.flash = err; break; }
      const set = { id: nid('s'), reps: +a.set.reps, weight: +a.set.weight, warmup: !!a.set.warmup, note: norm(a.set.note) };
      if (sess) { sess.lines.find(l => l.id === a.lineId).sets.push(set); break; }
      const d = currentDraft(s); if (!d.dayId) break;
      const turn = pinTurn(s, r, d.dayId);
      const replaced = s.skips.filter(k => k.date === s.viewDate && k.routineId === r.id).length;
      s.skips = s.skips.filter(k => !(k.date === s.viewDate && k.routineId === r.id));
      s.sessions.push({ id: nid('ss'), date: s.viewDate, routineId: r.id, dayId: d.dayId, turnId: turn ? turn.id : null, lines: d.lines.map(l => ({ ...l, sets: l.id === a.lineId ? [set] : [] })) });
      s.draft = null;
      s.flash = `Session started. ${D(s, d.dayId).name}'s Lines copied (Snapshot), pinned ${turn ? turnLabel(r, turn.id) : 'no Turn'}.` + (replaced ? ` Replaced ${replaced} Skip(s) on this date.` : '');
      break;
    }
    case 'UPDATE_SET': { const err = badSet(a.set); if (err) { s.flash = err; break; } const st = sess.lines.find(l => l.id === a.lineId).sets.find(x => x.id === a.setId); Object.assign(st, { reps: +a.set.reps, weight: +a.set.weight, warmup: !!a.set.warmup, note: norm(a.set.note) }); break; }
    case 'DELETE_SET': { const l = sess.lines.find(l => l.id === a.lineId); l.sets = l.sets.filter(x => x.id !== a.setId); if (!setCount(sess)) { s.sessions = s.sessions.filter(x => x !== sess); s.flash = 'Last Set deleted, so the Session is gone. Skips are not restored.'; } break; }
    case 'ADD_LINE': { const id = resolveEx(s, a.name); if (id) host().lines.push({ id: nid('sl'), exId: id, sets: [] }); break; }
    case 'REMOVE_LINE': { const h = host(); const l = h.lines.find(l => l.id === a.lineId); if (l.sets.length) { s.flash = 'A Line with Sets cannot be removed. Delete its Sets first.'; break; } h.lines = h.lines.filter(x => x !== l); break; }
    case 'MOVE_LINE': { const h = host(); move(h.lines, h.lines.findIndex(l => l.id === a.lineId), a.dir); break; }
    case 'SKIP': { const t = suggestedTurn(s, r); if (!t || sess) break; s.skips.push({ id: nid('k'), date: s.viewDate, routineId: r.id, turnId: t.id, dayId: t.dayId }); s.draft = null; s.flash = `Skipped ${D(s, t.dayId).name} (${turnLabel(r, t.id)}).`; break; }
    case 'UNDO_SKIP': { const mine = s.skips.filter(k => k.routineId === r.id); const last = mine[mine.length - 1]; if (last) { s.skips = s.skips.filter(k => k !== last); s.flash = 'Last Skip undone.'; } s.draft = null; break; }
    case 'ENGAGE': s.engagedId = a.routineId; s.draft = null; s.flash = `Engaged ${R(s, a.routineId).name}. New Sessions and Skips go here.`; break;
    case 'ROUTINE_NEW': { const n = norm(a.name); if (!n) break; if (s.routines.some(x => key(x.name) === key(n))) { s.flash = 'A Routine with that name already exists.'; break; } s.routines.push({ id: nid('r'), name: n, turns: [] }); break; }
    case 'DAY_NEW': { const n = norm(a.name); if (!n) break; if (s.days.some(d => d.routineId === a.routineId && key(d.name) === key(n))) { s.flash = 'This Routine already has a Day with that name.'; break; } const id = nid('d'); s.days.push({ id, routineId: a.routineId, name: n, lines: [] }); R(s, a.routineId).turns.push({ id: nid('t'), dayId: id }); break; }
    case 'DAY_DUP': { const src = D(s, a.dayId); let n = src.name + ' copy', i = 2; while (s.days.some(d => d.routineId === a.routineId && key(d.name) === key(n))) n = src.name + ' copy ' + (i++); const id = nid('d'); s.days.push({ id, routineId: a.routineId, name: n, lines: src.lines.map(l => ({ id: nid('dl'), exId: l.exId })) }); R(s, a.routineId).turns.push({ id: nid('t'), dayId: id }); s.flash = `Duplicated as "${n}" in ${R(s, a.routineId).name}.`; break; }
    case 'DAY_DROP': { const d = D(s, a.dayId), rr = R(s, d.routineId); rr.turns = rr.turns.filter(t => t.dayId !== d.id); break; }
    case 'DAY_DESTROY': { if (s.sessions.some(x => x.dayId === a.dayId)) { s.flash = 'A Session pins this Day, so it cannot be destroyed. Drop it from the rotation instead.'; break; } const d = D(s, a.dayId), rr = R(s, d.routineId); rr.turns = rr.turns.filter(t => t.dayId !== d.id); s.days = s.days.filter(x => x.id !== d.id); break; }
    case 'TURN_ADD': R(s, D(s, a.dayId).routineId).turns.push({ id: nid('t'), dayId: a.dayId }); break;
    case 'TURN_REMOVE': { const rr = R(s, a.routineId); rr.turns = rr.turns.filter(t => t.id !== a.turnId); break; }
    case 'TURN_MOVE': { const rr = R(s, a.routineId); move(rr.turns, rr.turns.findIndex(t => t.id === a.turnId), a.dir); break; }
    case 'DAY_LINE_ADD': { const id = resolveEx(s, a.name); if (id) D(s, a.dayId).lines.push({ id: nid('dl'), exId: id }); break; }
    case 'DAY_LINE_REMOVE': { const d = D(s, a.dayId); d.lines = d.lines.filter(l => l.id !== a.lineId); break; }
    case 'DAY_LINE_MOVE': { const d = D(s, a.dayId); move(d.lines, d.lines.findIndex(l => l.id === a.lineId), a.dir); break; }
  }
  if (s.flash) s.flashN = (state.flashN || 0) + 1;
  return s;
}

      ${s.routines.map(r => html`<button key=${r.id} onClick=${() => { dispatch({ type: 'ENGAGE', routineId: r.id }); setMenu(false); }}>${r.id === s.engagedId ? '● ' : '○ '}${r.name}</button>`)}</div>`}
    <main className="scroll">
      ${tab === 'log' && html`<${Fragment}>
        <${NotToday} s=${s} dispatch=${dispatch} />
        ${!L.started && s.viewDate !== today() ? html`<p className="pad muted">No Session on this date.</p>` :
          !L.started && !L.sug ? html`<p className="pad muted">Nothing is on ${eng.name}'s rotation. Edit the Routine under Routines.</p>` : html`<${Fragment}>
        ${L.started ? html`<div className="a-banner started"><b>${L.routine.name} · ${L.day.name}</b><span className="muted">${L.turnText} · ${setCount(L.session)} Sets</span></div>`
          : html`<div className="a-banner"><div className="row-btns"><b className="grow">Up next: ${L.day.name}</b><span className="muted">${L.turnText}</span></div>
            <div className="row-btns wrap"><select aria-label="Change Day" value=${L.day.id} onChange=${e => dispatch({ type: 'PICK_DAY', dayId: e.target.value })}>
              ${rotationDays(s, eng).map(d => html`<option key=${d.id} value=${d.id}>${d.name}</option>`)}</select>
              ${L.canSkip && html`<button className="btn sm" onClick=${() => dispatch({ type: 'SKIP' })}>Skip ${L.sug && D(s, L.sug.dayId).name}</button>`}
              ${s.skips.some(k => k.routineId === eng.id) && html`<button className="btn sm" onClick=${() => dispatch({ type: 'UNDO_SKIP' })}>Undo last Skip</button>`}</div>
            <span className="note">Nothing is saved until the first Set.${L.todaySkips.length ? ` ${L.todaySkips.length} Skip(s) today will be replaced.` : ''}</span></div>`}
        <div className="a-grid">${L.lines.map(l => { const lt = lastTime(s, l.exId, L.date); return html`<div key=${l.id} className="a-row">
          <div className="a-main"><div className="a-name">${EX(s, l.exId).name}</div>
            <div className="a-cells">${l.sets.map(st => html`<button key=${st.id} className=${'cell' + (st.warmup ? ' wu' : '')} onClick=${() => setEdit({ lineId: l.id, setId: st.id })}>
              <span>${st.weight}</span><small>×${st.reps}${st.note ? ' •' : ''}</small></button>`)}
              <button className="cell add" aria-label="Add Set" onClick=${() => setEdit({ lineId: l.id })}>+</button></div></div>
          <div className="a-lt">last ${ltInline(lt)}</div>
          ${lineEd && html`<div className="a-lineed"><button className="ic" onClick=${() => dispatch({ type: 'MOVE_LINE', lineId: l.id, dir: -1 })}>↑</button><button className="ic" onClick=${() => dispatch({ type: 'MOVE_LINE', lineId: l.id, dir: 1 })}>↓</button><button className="ic" onClick=${() => dispatch({ type: 'REMOVE_LINE', lineId: l.id })}>✕</button></div>`}
        </div>`; })}</div>
        <div className="pad"><${ExInput} s=${s} label="Add a Line" onAdd=${n => dispatch({ type: 'ADD_LINE', name: n })} />
          <button className="btn sm" onClick=${() => setLineEd(!lineEd)}>${lineEd ? 'Done editing Lines' : 'Reorder or remove Lines'}</button></div>
        <//>`}<//>`}
      ${tab === 'history' && html`<${History} s=${s} dispatch=${dispatch} onOpen=${() => setTab('log')} />`}
      ${tab === 'routines' && html`<${Routines} s=${s} dispatch=${dispatch} />`}
    </main>
    <nav className="tabs">${[['log', 'Log'], ['history', 'History'], ['routines', 'Routines']].map(([k, t]) => html`<button key=${k} className=${tab === k ? 'on' : ''} onClick=${() => setTab(k)}>${t}</button>`)}</nav>
    ${editLine && html`<${SetSheet} s=${s} line=${editLine} set=${edit.setId && editLine.sets.find(x => x.id === edit.setId)} date=${L.date} dispatch=${dispatch} onClose=${() => setEdit(null)} />`}
  </div>`;
}

/* ---------- Variant B: Focus ---------- */
function FocusEntry({ s, line, date, dispatch }) {
  const init = () => { const p = prefill(s, line, date); return { weight: p.weight, reps: p.reps, warmup: false, note: '' }; };
  const [f, setF] = useState(init);
  useEffect(() => { setF(init()); }, [line.id, line.sets.length]);
  const step = (k, d) => setF(x => ({ ...x, [k]: Math.max(k === 'reps' ? 1 : 0, (+x[k] || 0) + d) }));
  return html`<div style=${{ display: 'grid', gap: '12px' }}>
    <div className="stepper"><span className="lab">Weight (lb)</span><button onClick=${() => step('weight', -5)}>−5</button>
      <input id="b-w" inputMode="decimal" value=${f.weight} onChange=${e => setF({ ...f, weight: e.target.value })} aria-label="Weight" /><button onClick=${() => step('weight', 5)}>+5</button></div>
    <div className="stepper"><span className="lab">Reps</span><button onClick=${() => step('reps', -1)}>−1</button>
      <input id="b-r" inputMode="numeric" value=${f.reps} onChange=${e => setF({ ...f, reps: e.target.value })} aria-label="Reps" /><button onClick=${() => step('reps', 1)}>+1</button></div>
    <div className="row-btns"><label className="check"><input type="checkbox" checked=${f.warmup} onChange=${e => setF({ ...f, warmup: e.target.checked })} /> Warmup</label>
      <input className="note-in grow" placeholder="Note (optional)" value=${f.note} onChange=${e => setF({ ...f, note: e.target.value })} /></div>
    <button className="btn primary big" onClick=${() => dispatch({ type: 'ADD_SET', lineId: line.id, set: f })}>Save Set ${line.sets.length + 1}</button></div>`;
}
function VariantB({ s, dispatch }) {
  const [screen, setScreen] = useState('today'); const [drawer, setDrawer] = useState(false); const [go, setGo] = useState(false);
  const [idx, setIdx] = useState(0); const [picking, setPicking] = useState(false); const [edit, setEdit] = useState(null); const [adding, setAdding] = useState(false);
  const L = useLog(s); const eng = R(s, s.engagedId);
  const focus = screen === 'today' && (L.started || go);
  const i = Math.min(idx, Math.max(0, L.lines.length - 1)); const line = L.lines[i];
  const editLine = edit && L.lines.find(l => l.id === edit.lineId);
  return html`<div className="app">
    <header className="b-bar"><button className="ic" aria-label="Menu" onClick=${() => setDrawer(true)}>☰</button>
      <b className="grow">${screen === 'today' ? (focus ? `${L.routine.name} · ${L.day ? L.day.name : ''}` : 'Today') : screen === 'history' ? 'History' : 'Routines'}</b>
      ${focus && !L.started && html`<button className="btn sm" onClick=${() => setGo(false)}>Back</button>`}</header>
    ${drawer && html`<div className="b-drawer" onClick=${() => setDrawer(false)}><nav onClick=${e => e.stopPropagation()}>
      ${[['today', 'Today'], ['history', 'History'], ['routines', 'Routines']].map(([k, t]) => html`<button key=${k} className=${screen === k ? 'on' : ''} onClick=${() => { setScreen(k); setDrawer(false); }}>${t}</button>`)}
      <div className="b-eng"><span className="note">Engaged Routine</span>
        ${s.routines.map(r => html`<button key=${r.id} className=${r.id === s.engagedId ? 'on' : ''} onClick=${() => { if (r.id !== s.engagedId) dispatch({ type: 'ENGAGE', routineId: r.id }); setDrawer(false); setGo(false); }}>${r.id === s.engagedId ? '● ' : '○ '}${r.name}</button>`)}
        <span className="note">New Sessions and Skips go to the Engaged Routine. Past Sessions stay put.</span></div></nav></div>`}
    <main className="scroll">
      ${screen === 'today' && html`<${Fragment}><${NotToday} s=${s} dispatch=${dispatch} />
        ${!focus && (s.viewDate !== today() ? html`<p className="pad muted">No Session on this date.</p>` : !L.sug ? html`<p className="pad muted">Nothing is on ${eng.name}'s rotation. Open Routines from the menu.</p>` : html`<div className="b-today">
          <span className="muted">${eng.name} · ${L.turnText}</span><span className="big">${L.day.name}</span>
          ${L.overridden && html`<span className="note">Suggested was ${D(s, L.sug.dayId).name}</span>`}
          <button className="btn primary big" onClick=${() => { setGo(true); setIdx(0); }}>Start ${L.day.name}</button>
          ${picking ? html`<div className="b-days">${rotationDays(s, eng).map(d => html`<button key=${d.id} className="btn" onClick=${() => { dispatch({ type: 'PICK_DAY', dayId: d.id }); setPicking(false); }}>${d.name}</button>`)}</div>`
            : html`<div className="row-btns" style=${{ justifyContent: 'center' }}><button className="btn" onClick=${() => setPicking(true)}>Pick another Day</button>
              ${L.canSkip && html`<button className="btn" onClick=${() => dispatch({ type: 'SKIP' })}>Skip it</button>`}</div>`}
          ${s.skips.some(k => k.routineId === eng.id) && html`<button className="link" style=${{ textAlign: 'center' }} onClick=${() => dispatch({ type: 'UNDO_SKIP' })}>Undo last Skip</button>`}
          <span className="note">Start opens the Lines. The Session exists once you save a Set.</span></div>`)}
        ${focus && html`<${Fragment}>
          <div className="b-chips">${L.lines.map((l, j) => html`<button key=${l.id} className=${'b-chip' + (j === i ? ' on' : '')} onClick=${() => { setIdx(j); setAdding(false); }}>${EX(s, l.exId).name}<span className="n">${l.sets.length || ''}</span></button>`)}
            <button className="b-chip" onClick=${() => setAdding(!adding)}>+ Line</button></div>
          <div className="pad">
            ${adding && html`<${ExInput} s=${s} label="Add a Line" onAdd=${n => { dispatch({ type: 'ADD_LINE', name: n }); setIdx(L.lines.length); setAdding(false); }} />`}
            ${line ? html`<${Fragment}>
              <div className="row-btns"><span className="b-ex grow">${EX(s, line.exId).name}</span><span className="muted">${i + 1}/${L.lines.length}</span></div>
              <${LastTime} key=${line.id} lt=${lastTime(s, line.exId, L.date)} expandable />
              ${line.sets.length > 0 && html`<div className="b-sets">${line.sets.map((st, k) => html`<button key=${st.id} className=${'b-set' + (st.warmup ? ' wu' : '')} onClick=${() => setEdit({ lineId: line.id, setId: st.id })}>${k + 1}. ${st.weight}×${st.reps}${st.note ? ' •' : ''}</button>`)}</div>`}
              <${FocusEntry} key=${line.id} s=${s} line=${line} date=${L.date} dispatch=${dispatch} />
              <div className="b-nav"><button className="btn" disabled=${i === 0} onClick=${() => setIdx(i - 1)}>‹ Previous</button>
                ${!line.sets.length && html`<button className="btn sm danger" onClick=${() => dispatch({ type: 'REMOVE_LINE', lineId: line.id })}>Remove Line</button>`}
                <button className="btn" disabled=${i >= L.lines.length - 1} onClick=${() => setIdx(i + 1)}>Next ›</button></div><//>`
              : html`<p className="muted">This Day has no Lines. Add one above.</p>`}
          </div><//>`}<//>`}
      ${screen === 'history' && html`<${History} s=${s} dispatch=${dispatch} onOpen=${() => setScreen('today')} />`}
      ${screen === 'routines' && html`<${Routines} s=${s} dispatch=${dispatch} />`}
    </main>
    ${editLine && html`<${SetSheet} s=${s} line=${editLine} set=${editLine.sets.find(x => x.id === edit.setId)} date=${L.date} dispatch=${dispatch} onClose=${() => setEdit(null)} />`}
  </div>`;
}

/* ---------- Variant C: Timeline ---------- */
function QuickAdd({ s, line, date, dispatch }) {
  const init = () => { const p = prefill(s, line, date); return { weight: p.weight, reps: p.reps, warmup: false, note: '' }; };
  const [f, setF] = useState(init); const [noteOpen, setNoteOpen] = useState(false);
  useEffect(() => { setF(init()); setNoteOpen(false); }, [line.id, line.sets.length]);
  return html`<div style=${{ display: 'grid', gap: '6px' }}><div className="c-quick">
    <input inputMode="decimal" aria-label="Weight lb" placeholder="lb" value=${f.weight} onChange=${e => setF({ ...f, weight: e.target.value })} />
    <input inputMode="numeric" aria-label="Reps" placeholder="reps" value=${f.reps} onChange=${e => setF({ ...f, reps: e.target.value })} />
    <button className=${'w' + (f.warmup ? ' on' : '')} title="Warmup" onClick=${() => setF({ ...f, warmup: !f.warmup })}>W</button>
    <button className="btn primary" onClick=${() => dispatch({ type: 'ADD_SET', lineId: line.id, set: f })}>Add</button></div>
    ${noteOpen ? html`<input className="note-in" placeholder="Note for this Set" value=${f.note} onChange=${e => setF({ ...f, note: e.target.value })} />`
      : html`<button className="link" style=${{ fontSize: '12px', fontWeight: 500 }} onClick=${() => setNoteOpen(true)}>+ Note</button>`}</div>`;
}
function VariantC({ s, dispatch }) {
  const [open, setOpen] = useState(null); const [page, setPage] = useState('feed'); const [menu, setMenu] = useState(false); const [edit, setEdit] = useState(null);
  const L = useLog(s); const eng = R(s, s.engagedId);
  const editLine = edit && L.lines.find(l => l.id === edit.lineId);
  const feed = [...s.sessions.filter(x => x.date !== s.viewDate).map(x => ({ k: 's', date: x.date, x })), ...s.skips.filter(x => x.date !== s.viewDate).map(x => ({ k: 'k', date: x.date, x }))]
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  const cur = L.routine && cursorIdx(s, eng);
  return html`<div className="app">
    <header className="c-bar">
      ${page === 'routines' ? html`<button className="btn sm" onClick=${() => setPage('feed')}>‹ Back</button><b className="grow">Routines</b>`
        : html`<b className="grow">Wolog</b><button className="a-rsw" onClick=${() => setMenu(!menu)}>${eng.name} ▾</button><button className="ic" aria-label="Routines" onClick=${() => setPage('routines')}>⚙</button>`}</header>
    ${menu && html`<div className="a-menu" style=${{ left: 'auto', right: '12px' }}><span className="note" style=${{ padding: '4px 10px' }}>Engaged Routine</span>
      ${s.routines.map(r => html`<button key=${r.id} onClick=${() => { dispatch({ type: 'ENGAGE', routineId: r.id }); setMenu(false); }}>${r.id === s.engagedId ? '● ' : '○ '}${r.name}</button>`)}
      <button onClick=${() => { setPage('routines'); setMenu(false); }}>Edit Routines…</button></div>`}
    <main className="scroll">
      ${page === 'routines' ? html`<${Routines} s=${s} dispatch=${dispatch} />` : html`<${Fragment}>
      <div className="c-card"><div className="c-head">
        <div className="row-btns"><b className="grow">${s.viewDate === today() ? 'Today' : fmtDate(s.viewDate)}</b>
          ${s.viewDate !== today() && html`<button className="btn sm" onClick=${() => dispatch({ type: 'VIEW', date: today() })}>Back to today</button>`}</div>
        ${L.started ? html`<span><span className="chip session">Session</span> ${L.routine.name} · ${L.day.name} · <span className="muted">${L.turnText}</span></span>`
          : s.viewDate !== today() ? html`<span className="muted">No Session on this date.</span>`
          : !L.sug ? html`<span className="muted">Nothing is on ${eng.name}'s rotation. Tap ⚙ to edit it.</span>`
          : html`<${Fragment}><span className="muted">Tap a Turn to pick that Day. Dashed = where you are, blue = what you'll log.</span>
            <div className="c-ring">${eng.turns.map((t, j) => html`<button key=${t.id} className=${'c-turn' + (j === cur ? ' cur' : '') + (L.pin && L.pin.id === t.id ? ' pin' : '')} onClick=${() => dispatch({ type: 'PICK_DAY', dayId: t.dayId })}>
              <small>${j + 1}${j === cur ? ' · last' : ''}</small>${D(s, t.dayId).name}</button>`)}</div>
            <div className="row-btns">${L.canSkip && html`<button className="btn sm" onClick=${() => dispatch({ type: 'SKIP' })}>Skip ${D(s, L.sug.dayId).name}</button>`}
              ${s.skips.some(k => k.routineId === eng.id) && html`<button className="btn sm" onClick=${() => dispatch({ type: 'UNDO_SKIP' })}>Undo last Skip</button>`}
              <span className="note grow" style=${{ textAlign: 'right' }}>Saved at first Set</span></div><//>`}
      </div>
      ${(L.started || (s.viewDate === today() && L.sug)) && html`<${Fragment}>
        ${L.lines.map(l => { const lt = lastTime(s, l.exId, L.date); const isOpen = open === l.id;
          return html`<div key=${l.id} className="c-line"><button className="c-lhead" onClick=${() => setOpen(isOpen ? null : l.id)}>
            <b>${EX(s, l.exId).name}</b><span className="sum grow">${l.sets.length ? l.sets.map(x => x.weight + '×' + x.reps).join('  ') : 'last ' + ltInline(lt)}</span><span className="muted">${l.sets.length || ''}</span></button>
            ${isOpen && html`<div className="c-open"><div className="c-cols">
              <div className="c-col"><span className="h">${lt ? 'Last · ' + relDays(lt.date) : 'Last time'}</span>
                ${lt ? lt.groups.map((g, gi) => html`<${Fragment} key=${gi}>${lt.groups.length > 1 && html`<span className="muted">Line ${gi + 1}</span>`}${g.map(x => html`<span key=${x.id} className=${x.warmup ? 'wu' : ''}>${x.warmup ? 'W ' : ''}${x.weight}×${x.reps}${x.note ? ' *' : ''}</span>`)}<//>`) : html`<span className="muted">No earlier Sets</span>`}
                ${lt && lt.groups.flat().filter(x => x.note).map(x => html`<span key=${'n' + x.id} className="note">* ${x.note}</span>`)}</div>
              <div className="c-col"><span className="h">Today</span>${l.sets.map(x => html`<button key=${x.id} className=${x.warmup ? 'wu' : ''} onClick=${() => setEdit({ lineId: l.id, setId: x.id })}>${x.warmup ? 'W ' : ''}${x.weight}×${x.reps}${x.note ? ' *' : ''}</button>`)}
                ${!l.sets.length && html`<span className="muted">none yet</span>`}</div></div>
              <${QuickAdd} s=${s} line=${l} date=${L.date} dispatch=${dispatch} />
              ${!l.sets.length && html`<button className="link" style=${{ fontSize: '12px', color: 'var(--danger)' }} onClick=${() => dispatch({ type: 'REMOVE_LINE', lineId: l.id })}>Remove this Line</button>`}</div>`}</div>`; })}
        <div className="c-line" style=${{ padding: '10px 14px' }}><${ExInput} s=${s} label="Add a Line" onAdd=${n => dispatch({ type: 'ADD_LINE', name: n })} /></div><//>`}
      </div>
      <div className="c-feed"><h3>Earlier</h3><ul className="hist">${feed.map(it => html`<${HistItem} key=${it.x.id} s=${s} it=${it} onOpen=${() => { dispatch({ type: 'VIEW', date: it.date }); setOpen(null); }} />`)}</ul></div><//>`}
    </main>
    ${editLine && html`<${SetSheet} s=${s} line=${editLine} set=${editLine.sets.find(x => x.id === edit.setId)} date=${L.date} dispatch=${dispatch} onClose=${() => setEdit(null)} />`}
  </div>`;
}

/* ---------- prototype chrome ---------- */
const VARS = [['a', 'Sheet', VariantA], ['b', 'Focus', VariantB], ['c', 'Timeline', VariantC]];
const hashVar = () => { const h = location.hash.slice(1).toLowerCase(); return VARS.some(v => v[0] === h) ? h : 'b'; };
function debug(s) {
  const r = R(s, s.engagedId), sug = suggestedTurn(s, r), c = cursorIdx(s, r), sess = s.sessions.find(x => x.date === s.viewDate), d = currentDraft(s);
  return {
    viewDate: s.viewDate, engaged: r.name,
    rotation: r.turns.map((t, i) => `${i + 1}:${D(s, t.dayId).name}${i === c ? ' (cursor)' : ''}${sug && t.id === sug.id ? ' (next)' : ''}`),
    sessionOnDate: sess ? { routine: R(s, sess.routineId).name, day: D(s, sess.dayId).name, turn: turnLabel(R(s, sess.routineId), sess.turnId), lines: sess.lines.map(l => `${EX(s, l.exId).name}: ${l.sets.map(x => (x.warmup ? 'W' : '') + x.weight + 'x' + x.reps).join(' ') || '-'}`) } : null,
    unsavedDraft: sess ? null : { day: d.dayId && D(s, d.dayId).name, willPin: d.dayId && pinTurn(s, r, d.dayId) ? turnLabel(r, pinTurn(s, r, d.dayId).id) : null, lines: d.lines.map(l => EX(s, l.exId).name) },
    skips: s.skips.map(k => `${k.date} ${R(s, k.routineId).name} ${turnLabel(R(s, k.routineId), k.turnId)}`),
    sessions: s.sessions.map(x => `${x.date} ${R(s, x.routineId).name} ${D(s, x.dayId).name} [${setCount(x)} Sets]`).sort().reverse(),
  };
}
function Toast({ msg, n }) {
  const [show, setShow] = useState(false);
  useEffect(() => { if (!msg) return; setShow(true); const t = setTimeout(() => setShow(false), 3200); return () => clearTimeout(t); }, [n]);
  return show && msg ? html`<div className="toast" role="status">${msg}</div>` : null;
}
function App() {
  const [s, dispatch] = useReducer(reducer, null, seed);
  const [v, setV] = useState(hashVar); const [showState, setShowState] = useState(false);
  useEffect(() => { const f = () => setV(hashVar()); addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  const go = d => { const i = (VARS.findIndex(x => x[0] === v) + d + VARS.length) % VARS.length; location.hash = VARS[i][0]; setV(VARS[i][0]); };
  useEffect(() => {
    const k = e => { const t = e.target; if (t.closest && t.closest('input, textarea, select, [contenteditable]')) return; if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  });
  const cur = VARS.find(x => x[0] === v);
  return html`<${Fragment}>
    <div className="frame"><${cur[2]} key=${v} s=${s} dispatch=${dispatch} /></div>
    <${Toast} msg=${s.flash} n=${s.flashN} />
    ${showState && html`<div className="statepanel"><pre>${JSON.stringify(debug(s), null, 1)}</pre></div>`}
    <div className="switcher" aria-label="Prototype variant switcher">
      <button aria-label="Previous variant" onClick=${() => go(-1)}>‹</button><span className="lbl">${cur[0].toUpperCase()} · ${cur[1]}</span>
      <button aria-label="Next variant" onClick=${() => go(1)}>›</button>
      <button onClick=${() => setShowState(!showState)}>${showState ? 'Hide state' : 'State'}</button>
      <button onClick=${() => dispatch({ type: 'RESET' })}>Reset</button></div>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
