[project]
name = "wolog"
version = "0.1.0"
description = "Wolog API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = true
# Only versions at least two weeks old, as for the apps server's images.
exclude-newer = "2 weeks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["wolog", "tests"]
